[project]
name = "stocksense-backend"
version = "1.0.0"
description = "StockSense inventory management API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports/variables, undefined names
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplifiable code
    "N",   # PEP 8 naming
    "S",   # bandit: security issues
    "RET", # return-statement hygiene
    "C4",  # comprehensions
    "DTZ", # timezone-aware datetimes
    "T20", # no print()
]
ignore = [
    "B008", # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and hardcoded demo passwords (S105/S106).
"tests/**" = ["S101", "S105", "S106"]
# The QA report writes its output path to the console on purpose.
"tests/qa_report.py" = ["S101", "T201"]
"scripts/**" = ["S105", "S106", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
